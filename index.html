<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con Reconocimiento Facial</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-background: rgba(252, 252, 249, 1);
            --color-surface: rgba(255, 255, 253, 1);
            --color-text: rgba(19, 52, 59, 1);
            --color-primary: rgba(33, 128, 141, 1);
            --color-primary-hover: rgba(29, 116, 128, 1);
            --color-success: rgba(33, 128, 141, 1);
            --color-error: rgba(192, 21, 47, 1);
            --color-border: rgba(94, 82, 64, 0.2);
            --color-card-border: rgba(94, 82, 64, 0.12);
            --radius-lg: 12px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: rgba(31, 33, 33, 1);
                --color-surface: rgba(38, 40, 40, 1);
                --color-text: rgba(245, 245, 245, 1);
                --color-primary: rgba(50, 184, 198, 1);
                --color-primary-hover: rgba(45, 166, 178, 1);
                --color-success: rgba(50, 184, 198, 1);
                --color-error: rgba(255, 84, 89, 1);
                --color-border: rgba(119, 124, 124, 0.3);
                --color-card-border: rgba(119, 124, 124, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .login-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-card-border);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: rgba(98, 108, 113, 1);
            margin-bottom: 30px;
            font-size: 14px;
        }

        #webcam-container {
            width: 100%;
            height: 300px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-lg);
            margin: 20px 0;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--color-border);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scan-line {
            width: 80%;
            height: 2px;
            background: var(--color-primary);
            box-shadow: 0 0 10px var(--color-primary);
            position: absolute;
            opacity: 0;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-primary);
        }

        .corner.top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner.top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner.bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner.bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .status-bar {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(98, 108, 113, 0.1);
            border: 1px solid var(--color-border);
        }

        .status-text {
            font-weight: 500;
            font-size: 14px;
        }

        .progress-container {
            margin-top: 10px;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-success));
            transition: width 0.1s linear;
        }

        .confidence-display {
            margin-top: 10px;
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .success-screen {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0);
        }

        .error-message {
            color: var(--color-error);
            margin-top: 15px;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
        }

        .predictions {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: rgba(98, 108, 113, 1);
        }

        .predictions div {
            padding: 5px;
            border-radius: 4px;
            margin: 3px 0;
        }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--color-primary);
            border-radius: 50%;
            opacity: 0;
        }

        .game-screen {
            text-align: center;
        }

        .game-header {
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(33, 128, 141, 0.1);
            padding: 12px 20px;
            border-radius: 8px;
            flex: 1;
        }

        .stat-label {
            display: block;
            font-size: 12px;
            color: rgba(98, 108, 113, 1);
            margin-bottom: 5px;
        }

        .stat-value {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .game-area {
            width: 100%;
            height: 500px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: var(--radius-lg);
            border: 2px solid var(--color-border);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            background: #000;
            border: 2px solid var(--color-primary);
            box-shadow: 0 0 20px rgba(33, 128, 141, 0.3);
        }

        .game-controls {
            margin-top: 15px;
            padding: 15px;
            background: rgba(33, 128, 141, 0.1);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: rgba(98, 108, 113, 1);
        }

        .control-key {
            display: inline-block;
            padding: 5px 10px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            margin: 0 3px;
            font-weight: 600;
            font-size: 12px;
        }

        .game-over {
            padding: 30px;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 2px solid var(--color-card-border);
            margin-top: 20px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 700;
            color: var(--color-primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="login-card" id="loginCard">
            <h1>🔐 Login Facial</h1>
            <p class="subtitle">Permitir acceso solo a Yonsn</p>

            <div id="webcam-container">
                <div class="camera-overlay">
                    <div class="scan-line" id="scanLine"></div>
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-text" id="statusText">Presiona el botón para iniciar</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="confidence-display" id="confidenceDisplay">0%</div>
            </div>

            <button class="btn btn-primary" id="startBtn" onclick="init()">
                🎥 Iniciar Reconocimiento
            </button>

            <div class="error-message" id="errorMessage"></div>

            <div class="predictions" id="predictions"></div>

            <div class="success-screen" id="successScreen">
                <div class="success-icon">✅</div>
                <h2>¡Acceso Concedido!</h2>
                <p style="margin-top: 10px; color: var(--color-success);">Bienvenido, Yonsn</p>
                <button class="btn btn-primary" style="margin-top: 20px;" onclick="startGame()">
                    🎮 Jugar Ahora
                </button>
            </div>

            <div class="game-screen" id="gameScreen" style="display: none;">
                <div class="game-header">
                    <div class="game-stats">
                        <div class="stat">
                            <span class="stat-label">Puntos:</span>
                            <span class="stat-value" id="scoreDisplay">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Tiempo:</span>
                            <span class="stat-value" id="timerDisplay">30</span>
                        </div>
                    </div>
                </div>
                <h3 style="margin-bottom: 15px;">🎮 ¡Tetris Clásico!</h3>
                <div class="game-area" id="gameArea">
                    <canvas id="tetrisCanvas" width="300" height="480"></canvas>
                </div>
                <div class="game-controls">
                    <span class="control-key">←</span> <span class="control-key">→</span> Mover | 
                    <span class="control-key">↑</span> Rotar | 
                    <span class="control-key">↓</span> Caída rápida | 
                    <span class="control-key">ESPACIO</span> Caída instantánea
                </div>
                <button class="btn btn-primary" onclick="resetGame()" style="margin-top: 20px;">
                    🔄 Jugar de Nuevo
                </button>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/x0CTUthQj/";
        let model, webcam, maxPredictions;
        let isDetecting = false;
        let detectionStartTime = null;
        let detectionTimer = null;
        const REQUIRED_CONFIDENCE = 0.995; // 99.5% (más tolerante con redondeo)
        const REQUIRED_DURATION = 5000; // 5 segundos
        
        // Variables del juego
        let gameActive = false;
        let score = 0;
        let gameTimer = 0;
        let circles = [];
        let spawnInterval = 800; // Milisegundos entre spawns (se reduce con el tiempo)
        let circleLifetime = 2000; // Tiempo de vida de cada círculo (se reduce con el tiempo)
        let difficultyLevel = 1;
        
        console.log("Sistema iniciado. Requisitos: Confianza >= 99.5%, Duración = 5s");
        console.log("Clases disponibles: Yonsn, Class 2, Class 4, Class 5, Class 6, Class 7, Class 8");

        // Animación inicial de entrada
        gsap.to("#loginCard", {
            opacity: 1,
            scale: 1,
            y: 0,
            duration: 1,
            ease: "power3.out",
            delay: 0.2
        });

        async function init() {
            const startBtn = document.getElementById("startBtn");
            const statusText = document.getElementById("statusText");
            const errorMessage = document.getElementById("errorMessage");
            
            startBtn.disabled = true;
            startBtn.textContent = "⏳ Cargando modelo...";
            
            gsap.to(errorMessage, { opacity: 0, duration: 0.3 });

            try {
                // Cargar el modelo
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                statusText.textContent = "Cargando modelo de IA...";
                
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Configurar la webcam
                statusText.textContent = "Configurando cámara...";
                const flip = true;
                webcam = new tmImage.Webcam(300, 300, flip);
                await webcam.setup();
                await webcam.play();

                // Agregar canvas al contenedor
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                // Animación de entrada de la cámara
                gsap.from(webcam.canvas, {
                    opacity: 0,
                    scale: 0.8,
                    duration: 0.8,
                    ease: "back.out(1.7)"
                });

                // Iniciar animación de escaneo
                gsap.to("#scanLine", {
                    opacity: 0.7,
                    y: 280,
                    duration: 2,
                    repeat: -1,
                    ease: "linear"
                });

                statusText.textContent = "🎯 Buscando a Yonsn...";
                startBtn.style.display = "none";

                // Iniciar el loop de predicción
                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error("Error al inicializar:", error);
                statusText.textContent = "❌ Error al cargar";
                errorMessage.textContent = "No se pudo cargar el modelo. Verifica que los archivos estén en /public/";
                gsap.to(errorMessage, { opacity: 1, duration: 0.5 });
                startBtn.disabled = false;
                startBtn.textContent = "🔄 Reintentar";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            const statusText = document.getElementById("statusText");
            const confidenceDisplay = document.getElementById("confidenceDisplay");
            const progressBar = document.getElementById("progressBar");
            const errorMessage = document.getElementById("errorMessage");
            const predictionsDiv = document.getElementById("predictions");

            // Mostrar todas las predicciones con estilos
            predictionsDiv.innerHTML = prediction.map(p => {
                const confidence = (p.probability * 100).toFixed(1);
                const isYonsn = p.className.toLowerCase().includes('yonsn');
                const style = isYonsn && p.probability >= 0.99 ? 
                    'background: rgba(33, 128, 141, 0.2); font-weight: bold;' : '';
                return `<div style="${style}">${p.className}: ${confidence}%</div>`;
            }).join('');

            // Buscar la clase "Yonsn" (case insensitive y más tolerante)
            const yonsnPrediction = prediction.find(p => 
                p.className.toLowerCase().includes('yonsn') || 
                p.className === "Yonsn"
            );
            
            console.log("Predicción Yonsn encontrada:", yonsnPrediction);
            
            if (yonsnPrediction) {
                const confidence = yonsnPrediction.probability;
                const confidencePercent = (confidence * 100).toFixed(1);
                confidenceDisplay.textContent = `${confidencePercent}%`;

                // Animar el display de confianza
                gsap.to(confidenceDisplay, {
                    scale: 1.1,
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1
                });

                // Verificar si cumple con el requisito (99.5% o más para considerar 100%)
                const meetsRequirement = confidence >= 0.995;
                console.log(`Confianza: ${confidencePercent}% - Cumple requisito: ${meetsRequirement}`);
                
                // Validar que SOLO Yonsn puede pasar - nadie más
                const isOnlyYonsn = yonsnPrediction.probability >= 0.995;
                const othersHaveLowConfidence = prediction.every(p => 
                    p.className.toLowerCase().includes('yonsn') || p.probability < 0.5
                );
                
                if (meetsRequirement && isOnlyYonsn && othersHaveLowConfidence) {
                    if (!isDetecting) {
                        // Iniciar detección
                        isDetecting = true;
                        detectionStartTime = Date.now();
                        statusText.textContent = "✅ ¡Yonsn detectado! Manteniendo validación...";
                        
                        gsap.to(statusText, {
                            color: "var(--color-success)",
                            duration: 0.3
                        });

                        // Animar las esquinas
                        gsap.to(".corner", {
                            borderColor: "var(--color-success)",
                            scale: 1.1,
                            duration: 0.5,
                            repeat: -1,
                            yoyo: true
                        });
                    }

                    // Calcular progreso
                    const elapsed = Date.now() - detectionStartTime;
                    const progress = Math.min((elapsed / REQUIRED_DURATION) * 100, 100);
                    progressBar.style.width = progress + "%";
                    
                    console.log(`Progreso: ${progress.toFixed(1)}% - Tiempo: ${(elapsed/1000).toFixed(1)}s`);

                    // Si completó los 5 segundos
                    if (elapsed >= REQUIRED_DURATION) {
                        console.log("✅ Login exitoso!");
                        loginSuccess();
                    }

                } else {
                    // No cumple con el 100% o detecta a otra persona, resetear
                    if (isDetecting) {
                        resetDetection();
                        const reason = !isOnlyYonsn ? "❌ Solo Yonsn puede acceder" : "⚠️ Confianza perdida";
                        errorMessage.textContent = reason + ". Reiniciando validación...";
                        gsap.to(errorMessage, { opacity: 1, duration: 0.5 });
                        setTimeout(() => {
                            gsap.to(errorMessage, { opacity: 0, duration: 0.5 });
                        }, 2000);
                    }
                }
            } else {
                // No se encontró "Yonsn" en las predicciones
                if (isDetecting) {
                    resetDetection();
                    errorMessage.textContent = "❌ Yonsn no detectado. Reintentando...";
                    gsap.to(errorMessage, { opacity: 1, duration: 0.5 });
                    setTimeout(() => {
                        gsap.to(errorMessage, { opacity: 0, duration: 0.5 });
                    }, 2000);
                }
                confidenceDisplay.textContent = "0%";
            }
        }

        function resetDetection() {
            isDetecting = false;
            detectionStartTime = null;
            const progressBar = document.getElementById("progressBar");
            const statusText = document.getElementById("statusText");
            
            gsap.to(progressBar, { width: "0%", duration: 0.5 });
            statusText.textContent = "🎯 Buscando a Yonsn...";
            
            gsap.to(statusText, {
                color: "var(--color-text)",
                duration: 0.3
            });

            gsap.to(".corner", {
                borderColor: "var(--color-primary)",
                scale: 1,
                duration: 0.3
            });
        }

        function loginSuccess() {
            webcam.stop();
            
            const loginCard = document.getElementById("loginCard");
            const successScreen = document.getElementById("successScreen");
            const particles = document.getElementById("particles");

            // Ocultar elementos de escaneo
            gsap.to(["#webcam-container", ".status-bar", "#predictions"], {
                opacity: 0,
                y: -20,
                duration: 0.5,
                stagger: 0.1,
                onComplete: () => {
                    document.getElementById("webcam-container").style.display = "none";
                    document.querySelector(".status-bar").style.display = "none";
                    document.getElementById("predictions").style.display = "none";
                    
                    // Mostrar pantalla de éxito
                    successScreen.style.display = "block";
                    
                    gsap.to(".success-icon", {
                        opacity: 1,
                        scale: 1,
                        duration: 0.8,
                        ease: "elastic.out(1, 0.5)"
                    });

                    gsap.from(["#successScreen h2", "#successScreen p"], {
                        opacity: 0,
                        y: 20,
                        duration: 0.6,
                        stagger: 0.2,
                        delay: 0.3
                    });
                }
            });

            // Crear partículas de celebración
            createParticles();

            // Animar tarjeta
            gsap.to(loginCard, {
                scale: 1.05,
                duration: 0.3,
                yoyo: true,
                repeat: 1
            });
        }

        function createParticles() {
            const particles = document.getElementById("particles");
            const colors = ["var(--color-primary)", "var(--color-success)", "#FFD700"];

            for (let i = 0; i < 50; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                particle.style.left = Math.random() * 100 + "%";
                particle.style.top = "50%";
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particles.appendChild(particle);

                gsap.to(particle, {
                    opacity: 1,
                    y: -300 - Math.random() * 200,
                    x: (Math.random() - 0.5) * 400,
                    duration: 2 + Math.random(),
                    ease: "power2.out",
                    onComplete: () => particle.remove()
                });
            }
        }

        // JUEGO: TETRIS
        const COLS = 10;
        const ROWS = 16;
        const BLOCK_SIZE = 30;
        
        const TETROMINOS = {
            'I': { shape: [[1,1,1,1]], color: '#00F0F0' },
            'O': { shape: [[1,1],[1,1]], color: '#F0F000' },
            'T': { shape: [[0,1,0],[1,1,1]], color: '#A000F0' },
            'S': { shape: [[0,1,1],[1,1,0]], color: '#00F000' },
            'Z': { shape: [[1,1,0],[0,1,1]], color: '#F00000' },
            'J': { shape: [[1,0,0],[1,1,1]], color: '#0000F0' },
            'L': { shape: [[0,0,1],[1,1,1]], color: '#F0A000' }
        };
        
        let canvas, ctx;
        let board = [];
        let currentPiece = null;
        let currentX = 0;
        let currentY = 0;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let gameLoop = null;
        let linesCleared = 0;
        
        function startGame() {
            const successScreen = document.getElementById("successScreen");
            const gameScreen = document.getElementById("gameScreen");
            
            gsap.to(successScreen, {
                opacity: 0,
                y: -20,
                duration: 0.5,
                onComplete: () => {
                    successScreen.style.display = "none";
                    gameScreen.style.display = "block";
                    
                    gsap.from(gameScreen, {
                        opacity: 0,
                        scale: 0.9,
                        duration: 0.6,
                        ease: "back.out(1.7)"
                    });
                    
                    initGame();
                }
            });
        }

        function initGame() {
            gameActive = true;
            score = 0;
            linesCleared = 0;
            
            document.getElementById("scoreDisplay").textContent = score;
            document.getElementById("timerDisplay").textContent = linesCleared;
            
            canvas = document.getElementById("tetrisCanvas");
            ctx = canvas.getContext("2d");
            
            // Inicializar el tablero
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            
            // Crear primera pieza
            spawnPiece();
            
            // Controles del teclado
            document.addEventListener('keydown', handleKeyPress);
            
            // Iniciar game loop
            lastTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }
        
        function spawnPiece() {
            const pieces = Object.keys(TETROMINOS);
            const randomPiece = pieces[Math.floor(Math.random() * pieces.length)];
            currentPiece = TETROMINOS[randomPiece];
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;
            
            // Verificar game over
            if (collision(currentX, currentY, currentPiece.shape)) {
                endGame();
            }
        }
        
        function handleKeyPress(e) {
            if (!gameActive) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    move(-1);
                    break;
                case 'ArrowRight':
                    move(1);
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                    rotate();
                    break;
                case ' ':
                    hardDrop();
                    break;
            }
        }
        
        function move(dir) {
            currentX += dir;
            if (collision(currentX, currentY, currentPiece.shape)) {
                currentX -= dir;
            }
        }
        
        function moveDown() {
            currentY++;
            if (collision(currentX, currentY, currentPiece.shape)) {
                currentY--;
                merge();
                clearLines();
                spawnPiece();
            }
            dropCounter = 0;
        }
        
        function rotate() {
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );
            
            if (!collision(currentX, currentY, rotated)) {
                currentPiece.shape = rotated;
            }
        }
        
        function hardDrop() {
            while (!collision(currentX, currentY + 1, currentPiece.shape)) {
                currentY++;
            }
            merge();
            clearLines();
            spawnPiece();
            dropCounter = 0;
        }
        
        function collision(x, y, shape) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        const newX = x + col;
                        const newY = y + row;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        
        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        if (currentY + y >= 0) {
                            board[currentY + y][currentX + x] = currentPiece.color;
                        }
                    }
                });
            });
        }
        
        function clearLines() {
            let linesThisTurn = 0;
            
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesThisTurn++;
                    row++; // Revisar la misma fila de nuevo
                }
            }
            
            if (linesThisTurn > 0) {
                linesCleared += linesThisTurn;
                
                // Sistema de puntuación
                const points = [0, 100, 300, 500, 800];
                score += points[linesThisTurn];
                
                document.getElementById("scoreDisplay").textContent = score;
                document.getElementById("timerDisplay").textContent = linesCleared;
                
                gsap.to("#scoreDisplay", {
                    scale: 1.3,
                    color: "#FFD700",
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1,
                    onComplete: () => {
                        gsap.to("#scoreDisplay", {
                            color: "var(--color-primary)",
                            duration: 0.2
                        });
                    }
                });
                
                // Aumentar velocidad cada 10 líneas
                dropInterval = Math.max(100, 1000 - Math.floor(linesCleared / 10) * 100);
            }
        }
        
        function draw() {
            // Limpiar canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar el tablero
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        ctx.fillStyle = value;
                        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                });
            });
            
            // Dibujar pieza actual
            if (currentPiece) {
                ctx.fillStyle = currentPiece.color;
                currentPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            ctx.fillRect(
                                (currentX + x) * BLOCK_SIZE,
                                (currentY + y) * BLOCK_SIZE,
                                BLOCK_SIZE,
                                BLOCK_SIZE
                            );
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(
                                (currentX + x) * BLOCK_SIZE,
                                (currentY + y) * BLOCK_SIZE,
                                BLOCK_SIZE,
                                BLOCK_SIZE
                            );
                        }
                    });
                });
            }
            
            // Dibujar grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * BLOCK_SIZE, 0);
                ctx.lineTo(i * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * BLOCK_SIZE);
                ctx.lineTo(canvas.width, i * BLOCK_SIZE);
                ctx.stroke();
            }
        }
        
        function update(time = 0) {
            if (!gameActive) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            
            if (dropCounter > dropInterval) {
                moveDown();
            }
            
            draw();
            gameLoop = requestAnimationFrame(update);
        }

        function endGame() {
            gameActive = false;
            document.removeEventListener('keydown', handleKeyPress);
            if (gameLoop) cancelAnimationFrame(gameLoop);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = '18px Arial';
            ctx.fillText(`Puntos: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
            ctx.fillText(`Líneas: ${linesCleared}`, canvas.width / 2, canvas.height / 2 + 35);
        }

        function resetGame() {
            if (gameLoop) cancelAnimationFrame(gameLoop);
            document.removeEventListener('keydown', handleKeyPress);
            dropCounter = 0;
            dropInterval = 1000;
            initGame();
        }
    </script>
</body>
</html>
